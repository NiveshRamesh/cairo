version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    cooldown: { default-days: 7 }
    groups:
      python-deps: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    cooldown: { default-days: 7 }
