version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
    groups:
      python-deps: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: develop
